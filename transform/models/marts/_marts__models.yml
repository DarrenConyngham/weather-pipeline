# Range tests ignore NULLs, so hours missing one dataset (full outer join) still pass.
models:
  - name: dim_locations
    description: One row per location.
    columns:
      - name: location_id
        data_tests: [unique, not_null]
      - name: location_name
        data_tests: [not_null]

  - name: fct_hourly_conditions
    description: Weather and air quality per (location_id, observed_at_utc).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [location_id, observed_at_utc]
    columns:
      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_id
      - name: observed_at_utc
        data_tests: [not_null]
      - name: observed_at_local
        data_tests: [not_null]
      - name: temperature_c
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: -10, max_value: 50}}
      - name: relative_humidity_pct
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 100}}
      - name: cloud_cover_pct
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 100}}
      - name: wind_direction_deg
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 360}}
      - name: precipitation_mm
        data_tests: &non_negative
          - dbt_utils.accepted_range: {arguments: {min_value: 0}}
      - name: wind_speed_kmh
        data_tests: *non_negative
      - name: wind_gusts_kmh
        data_tests: *non_negative
      - name: pm10_ugm3
        data_tests: *non_negative
      - name: pm2_5_ugm3
        data_tests: *non_negative
      - name: nitrogen_dioxide_ugm3
        data_tests: *non_negative
      - name: ozone_ugm3
        data_tests: *non_negative
      - name: sulphur_dioxide_ugm3
        data_tests: *non_negative
      - name: carbon_monoxide_ugm3
        data_tests: *non_negative
      - name: european_aqi
        data_tests: *non_negative
      - name: us_aqi
        data_tests: *non_negative

  - name: fct_daily_conditions
    description: >-
      Daily weather and air quality per (location_id, local_date), on the SAST date.
      Partial days are kept; check is_complete_day before comparing days.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [location_id, local_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "min_temperature_c <= max_temperature_c"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hours_eaqi_poor_or_worse <= air_quality_hours"
    columns:
      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_id
      - name: local_date
        data_tests: [not_null]
      - name: hours_observed
        data_tests: &hour_count
          - not_null
          - dbt_utils.accepted_range: {arguments: {min_value: 1, max_value: 24}}
      - name: weather_hours
        data_tests: &hour_count_or_zero
          - not_null
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 24}}
      - name: air_quality_hours
        data_tests: *hour_count_or_zero
      - name: hours_eaqi_poor_or_worse
        data_tests: *hour_count_or_zero
      - name: is_complete_day
        data_tests: [not_null]
      - name: min_temperature_c
        data_tests: &temperature
          - dbt_utils.accepted_range: {arguments: {min_value: -10, max_value: 50}}
      - name: max_temperature_c
        data_tests: *temperature
      - name: total_precipitation_mm
        data_tests: *non_negative
      - name: worst_european_aqi
        data_tests: *non_negative
