[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Cape Town weather & air quality batch pipeline (Open-Meteo -> S3 -> dbt/DuckDB -> Evidence)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=2.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
    "sqlfluff>=4.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.sqlfluff.core]
dialect = "duckdb"
# The jinja templater stubs dbt's ref()/source() so linting needs no database or DATA_ROOT.
templater = "jinja"
max_line_length = 100
# AM04: `select *` is the normal dbt pass-through in intermediate models; staging pins the columns.
# RF03: misreads DuckDB struct access (response.hourly.time) as a table qualifier.
# ST06: we order columns grain keys first, then measures, not by expression type.
exclude_rules = "AM04,RF03,ST06"

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import `ingestion` and `dashboard` from the project root.
pythonpath = ["."]
