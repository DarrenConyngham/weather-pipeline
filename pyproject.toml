[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Cape Town weather & air quality batch pipeline (Open-Meteo -> S3 -> dbt/DuckDB -> Evidence)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=2.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
