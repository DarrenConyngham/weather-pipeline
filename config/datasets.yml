# Open-Meteo datasets we ingest. Check the Open-Meteo docs before changing
# variable names: they differ slightly between endpoints.
weather:
  url: https://api.open-meteo.com/v1/forecast
  hourly:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
    - cloud_cover
    - pressure_msl

# Outside Europe this comes from the CAMS global model (~40 km grid), so nearby
# locations often share one grid cell and return identical values.
air_quality:
  url: https://air-quality-api.open-meteo.com/v1/air-quality
  hourly:
    - pm10
    - pm2_5
    - nitrogen_dioxide
    - ozone
    - sulphur_dioxide
    - carbon_monoxide
    - european_aqi
    - us_aqi
