# Open-Meteo datasets we ingest. Check the Open-Meteo docs before changing
# variable names: they differ slightly between endpoints.
# Phase 1 only wires up weather; air_quality is added in phase 2.
weather:
  url: https://api.open-meteo.com/v1/forecast
  hourly:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
    - cloud_cover
    - pressure_msl
